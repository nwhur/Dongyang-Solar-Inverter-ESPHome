# ==============================================================================
# 홈어시스턴트 태양광 인버터 추천 대시보드 카드 (Lovelace YAML)
# ==============================================================================
# 사용 방법:
# 1. 홈어시스턴트 대시보드 우측 상단 점 3개 메뉴 > "대시보드 편집" 클릭
# 2. "카드 추가" > 맨 아래 "수동(Manual)" 카드 선택
# 3. 아래 YAML 코드를 복사하여 붙여넣고 저장하세요.
# ==============================================================================

# ------------------------------------------------------------------------------
# [옵션 A] 홈어시스턴트 기본 표준 카드 (HACS 등 외부 설치 없이 100% 바로 작동)
# ------------------------------------------------------------------------------
type: vertical-stack
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: gauge
        entity: sensor.solar_inverter_total_ac_power
        name: 실시간 발전 전력
        unit: W
        min: 0
        max: 6000 # 3kW 1대인 경우 3500, 2대인 경우 6500 권장
        severity:
          green: 2000
          yellow: 500
          red: 0
      - type: entity
        entity: sensor.solar_inverter_total_energy_today
        name: 오늘 총 발전량
        icon: mdi:calendar-today

  - type: entities
    title: ☀️ 태양광 발전 및 인버터 현황
    show_header_toggle: false
    entities:
      - entity: sensor.solar_inverter_total_energy
        name: 전체 누적 발전량
        icon: mdi:counter
      - entity: binary_sensor.solar_inverter_solar_inverter_status
        name: 모니터링 노드 상태
      - entity: sensor.solar_inverter_solar_inverter_wifi_signal
        name: Wi-Fi 신호 감도

  # (2대 병렬 인버터 사용자의 경우 아래 세부 인버터 카드를 추가하세요)
  - type: entities
    title: 인버터별 개별 발전 전력
    show_header_toggle: false
    entities:
      - entity: sensor.solar_inverter_inv1_ac_power
        name: 1번 인버터 발전 전력
      - entity: sensor.solar_inverter_inv1_energy_today
        name: 1번 오늘 발전량
      - entity: sensor.solar_inverter_inv2_ac_power
        name: 2번 인버터 발전 전력
      - entity: sensor.solar_inverter_inv2_energy_today
        name: 2번 오늘 발전량

